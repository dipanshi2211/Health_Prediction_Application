<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand fw-bold">Health Prediction App</span>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">← Back to Dashboard</a>
    </nav>

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Add Patient Details</h5>
            </div>
            <div class="card-body">
                <form id="add-patient-form" novalidate>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="full_name" class="form-control" placeholder="John Doe" required>
                        <div class="invalid-feedback">Full name is required.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" id="dob" class="form-control" required>
                        <div class="invalid-feedback">Date of birth cannot be in the future.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Your Email Address</label>
                        <input type="email" id="email" class="form-control" value="{{ email }}" readonly>
                    </div>

                    <hr>
                    <h6 class="text-muted mb-3">Blood Test Results</h6>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Glucose (mg/dL)</label>
                            <input type="number" id="glucose" class="form-control" placeholder="e.g. 90" step="0.1" min="0" required>
                            <div class="invalid-feedback">Must be a positive number.</div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Haemoglobin (g/dL)</label>
                            <input type="number" id="haemoglobin" class="form-control" placeholder="e.g. 13.5" step="0.1" min="0" required>
                            <div class="invalid-feedback">Must be a positive number.</div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Cholesterol (mg/dL)</label>
                            <input type="number" id="cholesterol" class="form-control" placeholder="e.g. 180" step="0.1" min="0" required>
                            <div class="invalid-feedback">Must be a positive number.</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">AI Remarks</label>
                        <textarea id="remarks" class="form-control" rows="3" placeholder="Click 'Generate Remarks' to auto-fill..." readonly></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="button" id="generate-btn" class="btn btn-outline-secondary">
                            Generate Remarks
                        </button>
                        <button type="submit" class="btn btn-primary w-100">
                            Save Patient
                        </button>
                    </div>

                    <div id="form-msg" class="mt-3"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Date validation — DOB cannot be future
        document.getElementById('dob').max = new Date().toISOString().split('T')[0];

        // Generate Remarks button — calls your Python backend
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const glucose     = document.getElementById('glucose').value;
            const haemoglobin = document.getElementById('haemoglobin').value;
            const cholesterol = document.getElementById('cholesterol').value;

            if (!glucose || !haemoglobin || !cholesterol) {
                alert('Please fill in all blood test values first.');
                return;
            }

            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.textContent = '⏳ Generating...';

            try {
                const res = await fetch('/generate_remarks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ glucose, haemoglobin, cholesterol })
                });
                const data = await res.json();
                document.getElementById('remarks').value = data.remarks;
            } catch (err) {
                alert('Failed to generate remarks. Try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = '🤖 Generate Remarks';
            }
        });

        // Form submission — saves to Firestore via backend
        document.getElementById('add-patient-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                full_name:    document.getElementById('full_name').value.trim(),
                dob:          document.getElementById('dob').value,
                email:        document.getElementById('email').value.trim(),
                glucose:      parseFloat(document.getElementById('glucose').value),
                haemoglobin:  parseFloat(document.getElementById('haemoglobin').value),
                cholesterol:  parseFloat(document.getElementById('cholesterol').value),
                remarks:      document.getElementById('remarks').value
            };

            const res  = await fetch('/api/patients', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            const msg = document.getElementById('form-msg');
            if (data.success) {
                msg.innerHTML = '<div class="alert alert-success">Patient added successfully!</div>';
                setTimeout(() => window.location.href = '/dashboard', 1500);
            } else {
                msg.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            }
        });
    </script>
</body>
</html>
